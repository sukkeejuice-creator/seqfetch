version: 1

# GSA-Human example. Endpoints are options, not hard-coded assumptions.
provider:
  name: gsa-human
  options:
    api_url: "https://ngdc.cncb.ac.cn/gsa-human/ajaxb/runinstudy"
    ftp_base: "ftp://download.big.ac.cn/gsa-human"
    https_base: "https://download.cncb.ac.cn/gsa-human"
    prefer: ftp
    md5_file: md5sum.txt
    metadata_workers: 4
    cache_ttl_hours: 24

selection:
  # Option A: project accessions; every run is selected.
  accessions:
    - HRA002792

  # Option B: a sample table. Uncomment and map the columns.
  # table: /data/samples.xlsx
  # sheet: sheet1
  # columns:
  #   project: HRA
  #   sample: HRS
  #   name: samples_name
  #   size_gib: "size(GB)"
  #   platform: platform
  # filters:
  #   platform: "10x Chromium"

storage:
  targets:
    - /data/disk1/seq
    # - /data/disk2/seq
  reserve_gib: 200
  layout: "{project}/{run}/{filename}"
  order: size_desc
  on_insufficient: stop

state:
  dir: /var/lib/seqfetch/gsa-human

transfer:
  curl: curl
  retries: 10
  attempts: 2
  retry_delay: 2
  connect_timeout: 60
  speed_time: 180
  speed_limit_kbps: 1024
  ftp_pasv: true
  ftp_method: singlecwd
  resume: true
  max_consecutive_failures: 5

verification:
  mode: streaming
  read_backup: true
  on_mismatch: redownload
  require_official_md5: false

status:
  enabled: false
  source_table: /data/samples.xlsx
  output_table: /data/samples_status.xlsx
  sheet: ""
  key: sample
  prefix: seq
  every_seconds: 300

reporting:
  every_seconds: 1800
  formats: [md, json, csv]
